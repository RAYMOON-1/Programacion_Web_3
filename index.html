<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioLink | Módulo 2 - Redes y Conversión</title>
    <!-- Fuentes de Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="bg-glow"></div>

    <main class="biolink">
        <!-- MÓDULO 1: PROFILE HEADER -->
        <header class="profile">
            <div class="profile__avatar-wrapper">
                <img class="profile__avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Nexus" alt="Avatar de Usuario">
                <span class="profile__status" title="Disponible para proyectos"></span>
            </div>

            <h1 class="profile__name">Dev Student <span class="profile__verified">✓</span></h1>
            <p class="profile__bio">Ingeniería en Sistemas Computacionales | Fullstack & Cloud Native 🚀</p>

            <div class="profile__tags">
                <span class="tag">#Fullstack</span>
                <span class="tag">#TSJZapopan</span>
                <span class="tag">#WebDev</span>
            </div>
        </header>

        <!-- PANEL DE MÉTRICAS -->
        <section class="stats-bar">
            <div class="stats-bar__item">
                <span class="stats-bar__number" id="click-counter">0</span>
                <span class="stats-bar__label">Clics Totales</span>
            </div>
        </section>

        <!-- MÓDULO 2: EMBUDO Y ENLACES DINÁMICOS -->
        <section class="links-container">
            <!-- Enlace Destacado (GitHub) -->
            <a href="https://github.com/TU_USUARIO" target="_blank" class="link-btn link-btn--featured">
                <span class="link-btn__icon">🐙</span>
                <div class="link-btn__text">
                    <span class="link-btn__title">Mi GitHub</span>
                    <span class="link-btn__sub">Proyectos y código fuente</span>
                </div>
                <span class="link-btn__badge">POPULAR</span>
            </a>

            <!-- Botón de Copiar Enlace -->
            <button class="link-btn" id="share-btn" type="button">
                <span class="link-btn__icon">🔗</span>
                <div class="link-btn__text">
                    <span class="link-btn__title">Compartir Perfil</span>
                    <span class="link-btn__sub">Copiar enlace al portapapeles</span>
                </div>
            </button>

            <!-- Call to Action (WhatsApp) -->
            <a href="https://wa.me/1234567890" target="_blank" class="link-btn link-btn--cta">
                <span class="link-btn__icon">💬</span>
                <div class="link-btn__text">
                    <span class="link-btn__title">Contacto Directo</span>
                    <span class="link-btn__sub">Escríbeme por WhatsApp</span>
                </div>
            </a>
        </section>

        <!-- REDES SOCIALES (LOGOS SVG REALES) -->
        <section class="socials">
            <!-- GitHub Logo -->
            <a href="https://github.com/TU_USUARIO" target="_blank" class="socials__icon" aria-label="GitHub">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
            </a>

            <!-- Instagram Logo -->
            <a href="https://instagram.com/TU_USUARIO" target="_blank" class="socials__icon" aria-label="Instagram">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
            </a>

            <!-- X / Twitter Logo -->
            <a href="https://x.com/TU_USUARIO" target="_blank" class="socials__icon" aria-label="X">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </a>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <p class="footer__text">&copy; 2026 Programación Web - TSJ Zapopan</p>
        </footer>
    </main>

    <!-- NOTIFICACIÓN DE ACCIÓN -->
    <div class="toast" id="toast">¡Enlace copiado al portapapeles! 🚀</div>

    <script src="script.js"></script>
</body>

</html>
